# render.yaml — infraestrutura como código no Render.
#
# Com este arquivo no repositório eu uso o modo "Blueprint" do Render: ele
# cria o serviço web e o banco Postgres já ligados, sem eu preencher formulário.
services:
  - type: web
    name: portfolio-django
    runtime: python
    plan: free
    region: oregon
    # Build: instalo dependências, junto os estáticos e aplico as migrações.
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py carregar_dados && python manage.py collectstatic --noinput"
    # Gunicorn escuta na porta que o Render injeta em $PORT.
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    # Endpoint leve que o Render consulta para saber se a aplicação está viva.
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true      # o Render gera e guarda a chave por mim
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: free
